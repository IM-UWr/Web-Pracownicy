# Pages CMS — formularze aktualnej strony Instytutu Matematycznego UWr.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: pracownicy
  label: Pracownicy
  type: collection
  path: src/content/pracownicy
  format: yaml
  filename: '{primary}.yml'
  view:
    fields:
    - imie_nazwisko
    - grupa
    - zaklad
    - pokoj
    - status_publikacji
    primary: imie_nazwisko
    sort:
    - imie_nazwisko
    default:
      sort: imie_nazwisko
      order: asc
  fields:
  - name: imie_nazwisko
    label: Imię i nazwisko
    type: string
    required: true
    description: Wpisz pełne imię i nazwisko. Służy także do łączenia danych tej osoby w innych działach.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: stopien
    label: Stopień / tytuł (np. dr hab., prof. UWr)
    type: string
    description: Tytuł lub stopień pokazywany przed nazwiskiem.
  - name: grupa
    label: Grupa
    type: select
    default: nauczyciel
    options:
      values:
      - name: nauczyciel
        label: Nauczyciele akademiccy
      - name: doktorant
        label: Doktoranci
      - name: administracja
        label: Administracja
      - name: emeryt
        label: Emerytowani pracownicy
    description: Określa grupę w spisie osób; służy też do obliczania liczebności kadry.
  - name: funkcja
    label: Funkcja (np. Sekretariat dydaktyczny)
    type: string
    description: Funkcja wyświetlana przy osobie w spisie.
  - name: funkcja_en
    label: 'EN: funkcja'
    type: string
    description: Angielska wersja pola Funkcja (np. Sekretariat dydaktyczny); puste oznacza użycie wersji polskiej.
  - name: zaklad
    label: Zakład
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: Powiązanie ze stroną zakładu. Lista pochodzi z Web-Instytut; dodanie zakładu wymaga uzupełnienia
      listy wyboru.
  - name: rok_studiow
    label: Rok studiów doktoranckich
    type: number
    description: Rok studiów doktoranckich w spisie doktorantów.
  - name: email
    label: E-mail
    type: string
    description: Adres e-mail do kontaktu.
  - name: telefon
    label: Telefon (tylko administracja — u pracowników naukowych nie podajemy)
    type: string
    description: Numer telefonu do kontaktu; przy osobach spoza administracji obowiązują zasady spisu pracowników.
  - name: pokoj
    label: Pokój
    type: string
    description: Numer lub nazwa pokoju wyświetlana w danych kontaktowych.
  - name: strona
    label: Strona domowa
    type: string
    description: Pełny adres strony zewnętrznej, do której prowadzi link.
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
  description: Spis osób oraz dane kontaktowe wykorzystywane także przy zakładach, władzach i opiekunach specjalności.
- name: strony
  label: Strony
  description: Strony informacyjne oraz teksty stron z listami. Adres wynika ze ścieżki pliku; nie zmieniaj nazw
    istniejących plików. Nowe strony nie są dopisywane do menu.
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - status_publikacji
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/pracownicy
    description: Tekst strony; nagłówek 2 tworzy sekcję. Opcja Bloki włącza układy cech, etapów, kontaktów, plików
      i pytań z list w tekście.
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/pracownicy
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linku.
  - name: opis_en
    label: 'EN: opis'
    type: text
    description: Angielska wersja pola Krótki opis (pod tytułem i w Google); puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{n} {etykieta}'
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
      description: Wartość w nagłówku, np. 8 albo 3 lata.
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
      description: Angielska wersja pola Liczba (np. 8 albo 3 lata); puste oznacza użycie wersji polskiej.
    - name: etykieta
      label: Podpis
      type: string
      required: true
      description: Napis wyświetlany przy tej pozycji.
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
      description: Angielska wersja pola Podpis; puste oznacza użycie wersji polskiej.
    description: Wartości i podpisy w nagłówku. Nie powtarzaj danych, które dana strona oblicza samodzielnie.
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
    description: Spis sekcji jest widoczny przy opcji Spis lub Oba. Menu i Brak wyłączają spis; ta wersja strony
      nie wyświetla bocznego menu działu.
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włącz, aby z list w tekście powstawały bloki treści: cechy, etapy, kontakty, pliki i pytania.'
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
