# Pages CMS — Web-Pracownicy: Pracownicy, doktoranci i administracja.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: pracownicy
  label: Pracownicy
  type: collection
  path: src/content/pracownicy
  format: yaml
  filename: '{primary}.yml'
  view:
    fields:
    - imie_nazwisko
    - grupa
    - zaklad
    - pokoj
    primary: imie_nazwisko
    sort: imie_nazwisko
  fields:
  - name: imie_nazwisko
    label: Imię i nazwisko
    type: string
    required: true
  - name: stopien
    label: Stopień / tytuł (np. dr hab., prof. UWr)
    type: string
  - name: grupa
    label: Grupa
    type: select
    default: nauczyciel
    options:
      values:
      - name: nauczyciel
        label: Nauczyciele akademiccy
      - name: doktorant
        label: Doktoranci
      - name: administracja
        label: Administracja
      - name: emeryt
        label: Emerytowani pracownicy
  - name: funkcja
    label: Funkcja (np. Sekretariat dydaktyczny)
    type: string
  - name: funkcja_en
    label: 'EN: funkcja'
    type: string
  - name: zaklad
    label: Zakład
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: rok_studiow
    label: Rok studiów doktoranckich
    type: number
  - name: email
    label: E-mail
    type: string
  - name: telefon
    label: Telefon (tylko administracja — u pracowników naukowych nie podajemy)
    type: string
  - name: pokoj
    label: Pokój
    type: string
  - name: strona
    label: Strona domowa
    type: string
- name: strony
  label: Strony
  description: 'Adres strony = ścieżka pliku, np. pracownicy.md → /pracownicy. Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: pracownicy.md (Pracownicy). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/pracownicy
    description: |-
      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Gdy włączone jest pole „Bloki” (niżej), kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    description: Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku). Puste = strona angielska pokaże treść polską.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/pracownicy
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list: true
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
