# Pages CMS — Web-Pracownicy: Pracownicy, doktoranci i administracja.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: tekst strony Pracownicy w jawnym Markdownie (ukryte format_tresci), ściągawka przy Treści, opis formularza Pracownicy.
# Zlecenie 42: przełącznik „Pracuje w Instytucie” (odznaczone = osoba odeszła; pliku nie usuwamy) i data odejścia; usuwanie osób w CMS wyłączone.
# Media (22.11.2026): tylko własne foldery repozytorium. Na stronie pliki ze wszystkich repozytoriów są we wspólnym /pliki,
# a ten sam plik w dwóch repozytoriach zatrzymuje budowę; osobne foldery to wykluczają. Pilnuje skrypty/sprawdz_pola_cms.py (Web-Core).
media:
- name: pracownicy
  label: 'Media'
  input: public/pliki/pracownicy
  output: /pliki/pracownicy
  rename: safe
settings:
  commit:
    identity: user
content:
- name: pracownicy
  label: Pracownicy
  description: "Spis osób: pracownicy, doktoranci, administracja. Widać go w Pracownikach, na stronach zakładów i przy władzach. Usuwanie wyłączone: po odejściu odznacz „Pracuje w Instytucie”."
  type: collection
  path: src/content/pracownicy
  format: yaml
  filename: '{primary}.yml'
  view:
    fields:
    - imie_nazwisko
    - grupa
    - zaklad
    - pokoj
    - pracuje
    primary: imie_nazwisko
    sort: imie_nazwisko
  fields:
  - name: imie_nazwisko
    label: Imię i nazwisko
    type: string
    required: true
  - name: stopien
    label: Stopień / tytuł (np. dr hab., prof. UWr)
    type: string
  - name: grupa
    label: Grupa
    type: select
    default: nauczyciel
    options:
      values:
      - name: nauczyciel
        label: Nauczyciele akademiccy
      - name: doktorant
        label: Doktoranci
      - name: administracja
        label: Administracja
      - name: emeryt
        label: Emerytowani pracownicy
  - name: pracuje
    label: Pracuje w Instytucie
    description: Po odejściu odznacz. Nie usuwaj osoby — jej nazwisko zostaje przy dawnych grantach i obronach.
    type: boolean
    default: true
  - name: data_odejscia
    label: Data odejścia (opcjonalnie)
    type: date
    default: ""
  - name: funkcja
    label: Funkcja (np. Sekretariat dydaktyczny)
    type: string
  - name: funkcja_en
    label: 'EN: funkcja'
    type: string
  - name: zaklad
    label: Zakład
    type: select
    options:
      values:
      - name: algebra-i-teoria-modeli
        label: Zakład Algebry i Teorii Modeli
      - name: analiza-funkcjonalna
        label: Zakład Analizy Funkcjonalnej
      - name: analiza-matematyczna
        label: Zakład Analizy Matematycznej
      - name: dydaktyka
        label: Pracownia Dydaktyki i Popularyzacji Matematyki
      - name: geometria
        label: Zakład Geometrii
      - name: rownania-rozniczkowe
        label: Zakład Równań Różniczkowych
      - name: statystyka
        label: Zakład Statystyki
      - name: teoria-mnogosci-i-topologia
        label: Zakład Teorii Mnogości i Topologii
      - name: teoria-prawdopodobienstwa
        label: Zakład Teorii Prawdopodobieństwa
    description: (lista z innego repozytorium — nowa pozycja wymaga dopisania w konfiguracji)
  - name: rok_studiow
    label: Rok studiów doktoranckich
    type: number
  - name: email
    label: E-mail
    type: string
  - name: telefon
    label: Telefon (tylko administracja — u pracowników naukowych nie podajemy)
    type: string
  - name: pokoj
    label: Pokój
    type: string
  - name: strona
    label: Strona domowa
    type: string
  operations:
    delete: false
- name: strony
  label: Strony
  description: 'Adres strony = ścieżka pliku, np. pracownicy.md → /pracownicy. Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: pracownicy.md (Pracownicy). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu. Treść w jawnym Markdownie, jak w Studiach.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Strona Pracownicy: tekst stoi nad listą osób; pusta Treść (albo sam komentarz) = sama lista.
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i w linku wpisz samą nazwę pliku: [tekst](nazwa.pdf); plik z innego repozytorium: [tekst](Web-Nauka/nazwa.pdf). Po wgraniu sprawdź nazwę w Media: gdy taka już jest, CMS dopisze -1. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł i hasło). Np. „Dane kontaktowe pracowników, doktorantów i administracji…”. Puste = opis domyślny.
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
